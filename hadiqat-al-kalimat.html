<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>حديقة الكلمات — تدريب مستمر على العربية الفصحى</title>
<meta name="description" content="أداة تدريب مستمر على اللغة العربية الفصحى للمعلمين والمتعلمين: مفردات، قواعد، ترتيب الجملة، مرادفات، تعبير شفهي وكتابي، ذاكرة، قراءة — مبنية على أسس بحثية في تعليم العربية.">
<meta name="theme-color" content="#5B4B8A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lav-deep:#4A3F72; --lav-mid:#6B5B95; --lav-soft:#9B8FC4;
    --wheat:#E8B84B; --terracotta:#C1652F; --sage:#7A9B76; --sky:#5B8AA6;
    --cream:#FFFBF4; --cream-dim:#EFEAF6; --ink:#332B4D; --ink-soft:#665F80;
    --plum:#8A4B6E; --gold:#D6A23C; --rose:#C97B8E; --shadow:0 6px 0 rgba(74,63,114,0.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 14% 8%, rgba(232,184,75,0.28), transparent 42%),
      radial-gradient(circle at 88% 90%, rgba(107,91,149,0.22), transparent 46%),
      radial-gradient(circle at 92% 10%, rgba(193,101,47,0.10), transparent 40%),
      radial-gradient(circle at 6% 88%, rgba(122,155,118,0.16), transparent 42%),
      var(--cream);
    font-family:'Tajawal', sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:18px 12px 40px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#221D33; --cream-dim:#2C2645; --ink:#F1EEFA; --ink-soft:#B9B2D6;
    }
  }
  :root[data-theme="dark"]{
    --cream:#221D33; --cream-dim:#2C2645; --ink:#F1EEFA; --ink-soft:#B9B2D6;
  }
  h1,h2{font-family:'Reem Kufi', sans-serif; font-weight:700;}
  h3{font-family:'Tajawal', sans-serif; font-weight:800;}
  .app{width:100%; max-width:480px;}

  .brand-header{text-align:center; margin-bottom:10px;}
  .brand-logo{width:76px; height:76px; border-radius:50%; box-shadow:0 6px 0 rgba(74,63,114,0.20); display:block; margin:0 auto;}
  .brand-tagline{font-family:'Reem Kufi', sans-serif; font-weight:700; font-size:21px; color:var(--terracotta); margin-top:6px;}
  .brand-credit{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  .hud{display:flex; align-items:center; gap:7px; margin-bottom:10px; flex-wrap:wrap;}
  .hud button{
    width:36px; height:36px; border-radius:50%; border:none;
    background:var(--lav-deep); color:var(--cream); font-size:16px; cursor:pointer;
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .hud button:disabled{opacity:.35; cursor:default; box-shadow:none;}
  .hud .title-pill{
    flex:1; text-align:center; background:var(--lav-mid); color:var(--cream);
    font-weight:700; font-size:13.5px; padding:8px 10px; border-radius:20px;
    box-shadow:var(--shadow); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .xp-pill{
    background:var(--wheat); color:var(--lav-deep); font-weight:800;
    padding:8px 12px; border-radius:20px; box-shadow:0 6px 0 rgba(166,120,20,0.35);
    font-size:13px; display:flex; align-items:center; gap:5px; flex:none; transition:transform .15s;
  }
  .xp-pill.pulse{transform:scale(1.14);}
  .guide-btn{background:var(--terracotta) !important;}

  .pill-btn{
    font-weight:700; font-size:13.5px; border:none; border-radius:18px;
    padding:9px 18px; cursor:pointer; background:var(--cream-dim); color:var(--ink); box-shadow:var(--shadow);
  }
  .pill-btn.primary{background:var(--terracotta); color:#fff; box-shadow:0 6px 0 #8F441C;}
  .pill-btn:disabled{opacity:.4; cursor:default;}
  .msg{min-height:18px; font-size:12.5px; color:var(--terracotta); font-weight:800; text-align:center;}

  .level-card{display:flex; align-items:center; gap:12px; background:var(--cream-dim); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow); margin-bottom:14px;}
  .level-card .emoji{font-size:30px;}
  .level-card .info{flex:1; min-width:0;}
  .level-card .info b{font-weight:800; color:var(--lav-deep); font-size:16.5px;}
  .level-card .bar{background:#fff2; border-radius:6px; height:8px; margin-top:5px; overflow:hidden;}
  .level-card .bar-fill{background:var(--sage); height:100%; border-radius:6px; transition:width .3s;}
  .level-card small{color:var(--ink-soft); font-size:11px;}

  .tier-select{display:flex; gap:6px; margin-bottom:16px;}
  .tier-btn{flex:1; font-weight:700; font-size:11.5px; padding:9px 4px; border-radius:12px; border:2px solid var(--cream-dim); background:var(--cream-dim); color:var(--ink-soft); cursor:pointer; text-align:center; line-height:1.3;}
  .tier-btn.active{background:var(--lav-mid); border-color:var(--lav-mid); color:#fff;}

  .hub-title{text-align:center; margin-bottom:2px;}
  .hub-title h1{margin:0; font-size:26px; color:var(--lav-deep); letter-spacing:0;}
  .hub-title p{margin:4px 0 16px; color:var(--ink-soft); font-size:12.5px; text-align:center;}
  .station-grid{display:flex; flex-direction:column; gap:11px;}
  .station-card{display:flex; align-items:center; gap:13px; background:var(--cream-dim); border-radius:18px; padding:13px 15px; box-shadow:var(--shadow); border:none; cursor:pointer; text-align:right; width:100%;}
  .station-card .icon{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:21px; flex:none; background:var(--lav-mid);}
  .station-card .info{flex:1; min-width:0;}
  .station-card .info h3{margin:0 0 1px; font-size:14.5px; color:var(--lav-deep);}
  .station-card .info p{margin:0; font-size:11px; color:var(--ink-soft);}
  .station-card .tag{display:inline-block; margin-top:5px; font-size:9px; font-weight:800; letter-spacing:.2px; background:#0000000d; color:var(--ink-soft); padding:2px 7px; border-radius:8px;}
  .station-card .chev{font-size:19px; color:var(--ink-soft); flex:none;}
  .station-card.teacher .icon{background:var(--terracotta);}

  .subtitle{margin:4px 0 0; color:var(--ink-soft); font-size:12.5px; text-align:center;}
  .tip-banner{display:flex; align-items:flex-start; gap:8px; background:var(--cream-dim); border-right:4px solid var(--wheat); border-radius:10px; padding:9px 10px; font-size:11.5px; color:var(--ink-soft); margin-bottom:12px;}
  .tip-banner span:first-child{flex:none;}
  .tip-close{margin-right:auto; background:none; border:none; font-size:15px; color:var(--ink-soft); cursor:pointer; flex:none; padding:0 2px;}

  .quiz-progress{display:flex; gap:4px; margin-bottom:10px;}
  .seg{flex:1; height:5px; border-radius:3px; background:var(--cream-dim);}
  .seg.current{background:var(--wheat);} .seg.done{background:var(--sage);}
  .quiz-card{background:var(--cream-dim); border-radius:16px; padding:16px 15px; box-shadow:var(--shadow); margin-bottom:14px;}
  .qtext{font-weight:800; font-size:16.5px; margin:0 0 14px; color:var(--ink);}
  .options{display:flex; flex-direction:column; gap:8px;}
  .option-btn{font-weight:700; font-size:14px; padding:11px 13px; border-radius:11px; border:2px solid #0000; background:#fff; color:var(--ink); cursor:pointer; text-align:right;}
  .option-btn.correct{background:#DDF0DC; border-color:var(--sage); color:#2C5A2A;}
  .option-btn.wrong{background:#F6D9D9; border-color:var(--terracotta); color:#8A2E17;}
  .option-btn:disabled{cursor:default;}
  .explain{max-height:0; overflow:hidden; transition:max-height .25s ease; font-size:12.5px; color:var(--ink-soft); margin-top:0;}
  .explain.show{max-height:200px; margin-top:12px;}
  .quiz-footer{display:flex; justify-content:center;}

  .scramble-target{min-height:56px; background:var(--cream-dim); border-radius:14px; padding:10px; display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; align-items:center;}
  .scramble-target.empty::before{content:'المس الكلمات في الأسفل لتكوين الجملة'; font-size:12px; color:var(--ink-soft);}
  .pool-wrap{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:8px;}
  .chip{font-weight:700; font-size:13.5px; padding:8px 13px; border-radius:12px; cursor:pointer;}
  .chip.answer{background:var(--lav-mid); color:#fff; box-shadow:0 4px 0 var(--lav-deep);}
  .chip.pool{background:#fff; color:var(--ink); box-shadow:var(--shadow);}
  .scramble-actions{display:flex; gap:10px; justify-content:center; margin-top:10px;}
  .shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .match-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;}
  .match-card{aspect-ratio:1/1; border-radius:12px; background:var(--lav-mid); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 0 var(--lav-deep);}
  .match-card .face{display:none; font-weight:700; font-size:11px; color:var(--ink); text-align:center; padding:3px; line-height:1.2;}
  .match-card.flipped, .match-card.matched{background:#fff;}
  .match-card.flipped .face, .match-card.matched .face{display:block;}
  .match-card.matched{background:#DDF0DC; box-shadow:0 4px 0 var(--sage);}
  .match-stats{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:8px;}

  .mode-toggle{display:flex; gap:8px; justify-content:center; margin-bottom:12px;}
  .mode-btn{font-weight:700; font-size:13px; padding:8px 16px; border-radius:14px; border:2px solid var(--cream-dim); background:var(--cream-dim); color:var(--ink-soft); cursor:pointer;}
  .mode-btn.active{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}
  .scene-card{background:var(--cream-dim); border-radius:16px; padding:14px 15px; box-shadow:var(--shadow); margin-bottom:12px;}
  .scene-card h2{margin:0 0 6px; font-size:19px; color:var(--lav-deep);}
  .vocab{font-size:11.5px; color:var(--ink-soft); margin-bottom:10px;}
  .task-box{font-weight:700; font-size:14.5px; color:var(--ink); background:#fff; border-radius:10px; padding:10px 11px;}
  .timer-box{font-family:'Reem Kufi'; font-weight:700; font-size:30px; text-align:center; color:var(--lav-deep); margin:10px 0;}
  .write-box{width:100%; min-height:90px; border-radius:10px; border:2px solid var(--cream-dim); padding:10px; font-family:'Tajawal'; font-size:13.5px; resize:vertical;}
  .word-count{font-size:11px; color:var(--ink-soft); text-align:left; margin-top:3px;}
  .checklist{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-soft); margin:12px 0;}
  .checklist label{display:flex; align-items:center; gap:7px;}
  .credit{font-size:10.5px; color:var(--ink-soft); text-align:center; margin-top:14px;}

  .flashcard{background:var(--cream-dim); border-radius:18px; padding:30px 18px; text-align:center; box-shadow:var(--shadow); margin-bottom:14px; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;}
  .flashcard .icon-emoji{font-size:40px;}
  .flashcard .word{font-family:'Reem Kufi'; font-weight:700; font-size:25px; color:var(--lav-deep);}
  .flashcard .def{font-size:13.5px; color:var(--ink-soft); max-height:0; overflow:hidden; transition:max-height .25s;}
  .flashcard .def.show{max-height:100px;}
  .rate-row{display:flex; gap:10px; justify-content:center;}
  .rate-btn{font-weight:700; font-size:13px; padding:10px 16px; border-radius:14px; border:none; cursor:pointer;}
  .rate-btn.no{background:#F6D9D9; color:#8A2E17;}
  .rate-btn.yes{background:#DDF0DC; color:#2C5A2A;}
  .recall-stats{text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:10px;}

  .passage-card{background:var(--cream-dim); border-radius:16px; padding:14px 15px; box-shadow:var(--shadow); font-size:14.5px; line-height:1.9; margin-bottom:14px;}
  .rq-question{font-weight:800; font-size:13.5px; margin:12px 0 7px; color:var(--ink);}

  .groups-wrap{display:flex; flex-direction:column; gap:12px;}
  .word-pool{display:flex; flex-wrap:wrap; gap:7px; justify-content:center;}
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .cat-card{background:#fff; border-radius:12px; padding:12px 8px; text-align:center; font-weight:700; font-size:12.5px; box-shadow:var(--shadow); cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:center;}
  .cat-card.selected{outline:3px solid var(--wheat);}
  .cat-card .placed{font-size:10px; color:var(--ink-soft); font-weight:400; display:block; margin-top:3px;}
  .word-chip{font-weight:700; font-size:13px; padding:8px 13px; border-radius:12px; background:var(--lav-mid); color:#fff; cursor:pointer; box-shadow:0 4px 0 var(--lav-deep);}
  .word-chip.selected{background:var(--terracotta); box-shadow:0 4px 0 #8F441C;}

  .streak-row{text-align:center; margin-bottom:10px;}
  .streak-pill{background:var(--gold); color:var(--lav-deep); font-weight:800; padding:6px 14px; border-radius:16px; font-size:13px;}
  .daily-label{text-align:center; font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .daily-done{text-align:center; padding:20px 10px;}
  .big-emoji{font-size:44px; margin-bottom:6px;}

  .guide-section{background:var(--cream-dim); border-radius:14px; padding:13px 14px; margin-bottom:11px;}
  .guide-section h3{margin:0 0 5px; font-size:14.5px; color:var(--lav-deep);}
  .guide-section p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .guide-intro{font-size:13px; color:var(--ink); line-height:1.7; margin-bottom:14px;}
  .guide-use{background:#fff; border-radius:12px; padding:12px 13px; margin-bottom:6px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}

  .year-list{display:flex; flex-direction:column; gap:7px; margin-bottom:6px;}
  .week-card{display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:9px 11px; box-shadow:var(--shadow); border:none; cursor:pointer; text-align:right; width:100%;}
  .week-num{font-family:'Reem Kufi'; font-weight:700; font-size:15px; color:var(--lav-deep); width:22px; flex:none; text-align:center;}
  .week-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .week-info b{font-size:11.5px; color:var(--ink); font-weight:800;}
  .week-info span{font-size:10px; color:var(--ink-soft);}
  .week-tier{font-size:9.5px; font-weight:800; color:var(--ink-soft); background:var(--cream-dim); padding:3px 7px; border-radius:8px; flex:none;}

  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--lav-deep); color:#fff; font-weight:700; font-size:12.5px; padding:10px 18px; border-radius:20px; opacity:0; transition:all .25s; pointer-events:none; z-index:50; white-space:nowrap; max-width:90vw; text-overflow:ellipsis; overflow:hidden;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .confetti-piece{position:fixed; top:-30px; z-index:60; pointer-events:none; animation:fall 2s ease-in forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(200deg); opacity:0;}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   الحالة المشتركة
========================================================= */
const TIERS = ['مبتدئ','متوسط','متقدم'];
const TIER_CEFR = {'مبتدئ':'A1–A2', 'متوسط':'B1–B2', 'متقدم':'B2–C1'};
const LEVELS_META = [
  {name:'بذرة', icon:'🌱', min:0},
  {name:'برعم', icon:'🌿', min:150},
  {name:'شتلة', icon:'🪴', min:400},
  {name:'شجرة مزهرة', icon:'🌳', min:800},
  {name:'حديقة مزدهرة', icon:'🌳✨', min:1500},
];

const state = {
  screen:'hub', tier:'مبتدئ', xp:0,
  stationXP:{wheel:0, grammar:0, scramble:0, match:0, describe:0, recall:0, reading:0, groups:0, daily:0},
  wheel:{levelIndex:0}, grammar:{qIndex:0, order:[], tier:null},
  scramble:{sIndex:0, order:[], answer:[], pool:[], tier:null},
  match:{cards:[], roundPairs:[], flipped:[], matched:new Set(), moves:0},
  describe:{mode:'speak', scene:null, task:null, timeLeft:0, timerId:null},
  recall:{queue:[], mastered:0}, reading:{pIndex:0, answers:[null,null,null], checked:false},
  groups:{tier:null, cats:[], pool:[], selectedId:null, moves:0},
  daily:{date:null, tier:null, stepIndex:0, items:null, streak:0, xpEarnedToday:0, gAnswered:false, scAnswer:[], scPool:[], catSelected:null, catAnswered:false, done:false},
  showYearPlan:false, showGuide:false, dismissedTips:new Set(),
};

const app = document.getElementById('app');
const el = id => document.getElementById(id);
function goHub(){ if(state.describe.timerId){ clearInterval(state.describe.timerId); state.describe.timerId=null; } state.screen='hub'; state.showYearPlan=false; state.showGuide=false; render(); }
function shuffledIndices(n){ const a=[...Array(n).keys()]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function addXP(station,n){
  state.xp+=n; state.stationXP[station]+=n;
  const pill=document.querySelector('.xp-pill');
  if(pill){ pill.textContent=`🌰 ${state.xp} نقطة`; pill.classList.add('pulse'); setTimeout(()=>pill.classList.remove('pulse'),220); }
}
let toastTimer=null;
function showToast(text){ const t=el('toast'); t.textContent=text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
const CONFETTI_EMOJI=['🎉','🌟','🌸','✨','🍇','🎊'];
function fireConfetti(){
  for(let i=0;i<14;i++){
    const p=document.createElement('div'); p.className='confetti-piece'; p.textContent=CONFETTI_EMOJI[Math.floor(Math.random()*CONFETTI_EMOJI.length)];
    p.style.left=Math.random()*100+'vw'; p.style.animationDelay=(Math.random()*0.4)+'s'; p.style.fontSize=(16+Math.random()*14)+'px';
    document.body.appendChild(p); setTimeout(()=>p.remove(),2200);
  }
}
function levelInfo(xp){ let cur=LEVELS_META[0], next=LEVELS_META[1]||null; for(let i=0;i<LEVELS_META.length;i++){ if(xp>=LEVELS_META[i].min){cur=LEVELS_META[i]; next=LEVELS_META[i+1]||null;} } return {cur,next}; }

const TIP_TEXT = {
  hub:"جديد هنا؟ اختر مستوى صفك ثم محطة — كل شيء غير محدود، مناسب للإحماء أو الورشات الدوارة أو الواجبات الذاتية. زر 🎓 يشرح الأسس التربوية لهذا التطبيق.",
  wheel:"كل مجموعة أحرف هنا مبنية على جذر عربي واحد (مثل ك-ت-ب)، فتكوين كلمات مختلفة منه يدرّب على نظام الجذر والوزن المميز للعربية، ويسرّع اكتساب المفردات الجديدة.",
  grammar:"اختر الإجابة الصحيحة ثم اقرأ الشرح: التغذية الراجعة الفورية بعد محاولة فعلية ترسّخ القاعدة أفضل من درس نظري وحده.",
  scramble:"إعادة ترتيب الكلمات تدرّب على بنية الجملة العربية ضمنيا دون شرح نحوي مسبق — مفيد لأتمتة الاستخدام الصحيح.",
  match:"محاولات أقل ونجوم أكثر أفضل: هذه اللعبة تدرّب التعرف السريع على المعنى، وهي مهارة أساسية للطلاقة.",
  describe:"بروح المقاربة الفعلية: استخدم المشهد مع زميل أو مجموعة صغيرة أو بمفردك، شفهيا أو كتابيا، ثم أشّر على القائمة بعد إنجاز المهمة.",
  recall:"حاول تذكر المعنى قبل قلب البطاقة. الكلمات غير المتقنة تعود بشكل أسرع — تطبيقا لمبدأ التكرار المتباعد لمواجهة منحنى النسيان.",
  reading:"اقرأ النص ثم أجب عن الأسئلة الثلاثة، ثم تحقق من إجاباتك لمعرفة نتيجتك.",
  groups:"المس كلمة ثم فئتها. تصنيف كل الكلمات يحمّل مجموعة جديدة — تدريب جيد على المفردات المرتبطة بموضوع واحد.",

function weekPlan(weekNum){
  const tierIdx = Math.min(Math.floor((weekNum-1)/12), 2);
  const tier = TIERS[tierIdx];
  const weekInTier = (weekNum-1)%12;
  const cats = GROUPS_BY_TIER[tier];
  const cat = cats[weekInTier % cats.length];
  const gramPool = GRAMMAR.filter(g=>g.tier===tier);
  const gram = gramPool[weekInTier % gramPool.length];
  return {weekNum, tier, category:cat.name, grammarFocus:gram.q.replace('___','...')};
}
function renderYearPlanList(){
  let out = `<p class="subtitle" style="margin-bottom:12px;">٣٦ أسبوعا، ١٢ لكل مستوى — بمعدل منتظم يقارب سنة دراسية. المس أسبوعا لضبط المستوى.</p>`;
  TIERS.forEach((tier,ti)=>{
    const startWeek = ti*12+1;
    out += `<h3 style="color:var(--lav-deep); margin:14px 0 6px;">${tier} (${TIER_CEFR[tier]}) — الأسابيع ${startWeek}-${startWeek+11}</h3><div class="year-list">`;
    for(let w=startWeek; w<=startWeek+11; w++){
      const p = weekPlan(w);
      out += `<button class="week-card" data-week="${w}" data-tier="${p.tier}">
        <div class="week-num">${w}</div>
        <div class="week-info"><b>${p.category} &bull; القواعد: ${p.grammarFocus}</b><span>عائلات الكلمات + تحدي القواعد + صف المشهد</span></div>
        <div class="week-tier">${p.tier}</div>
      </button>`;
    }
    out += `</div>`;
  });
  return out;
}
function attachYearPlan(){
  document.querySelectorAll('.week-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tier = btn.dataset.tier; state.showYearPlan=false; render(); showToast(`تم ضبط المستوى على ${btn.dataset.tier} — الأسبوع ${btn.dataset.week}`); });
  });
}

function stationHeader(title){
  return `<div class="hud">
    <button id="backBtn">⌂</button>
    <div class="title-pill">${title}</div>
    <div class="xp-pill">🌰 ${state.xp} نقطة</div>
  </div>`;
}
function attachHeader(){ el('backBtn').addEventListener('click', goHub); }

/* =========================================================
   ١) عجلة الكلمات (مفردات مبنية على الجذر، غير محدودة)
========================================================= */
const WHEEL_BY_TIER = {
  'مبتدئ': [
    {letters:'كتباةم', words:['كتب','كاتب','كتاب','مكتب','مكتبة']},
    {letters:'درسامة', words:['درس','مدرس','مدرسة','دراسة']},
    {letters:'جملية', words:['جمل','جميل','جملة']},
  ],
  'متوسط': [
    {letters:'علمتا', words:['علم','عالم','تعلم']},
    {letters:'كبريأ', words:['كبر','كبير','أكبر']},
    {letters:'نظرماة', words:['نظر','منظر','نظارة']},
  ],
  'متقدم': [
    {letters:'حضراة', words:['حضر','حاضر','حضارة']},
    {letters:'قصدامتا', words:['قصد','مقصد','اقتصاد']},
    {letters:'طورتم', words:['طور','تطور','متطور']},
  ],
};
Object.values(WHEEL_BY_TIER).flat().forEach(l=> l.words.sort((a,b)=>a.length-b.length || a.localeCompare(b)));
const WHEEL_HINTS = 3;
let wheelRun = null;
function currentWheelLevels(){ return WHEEL_BY_TIER[state.tier]; }
function newWheelRun(idx){
  const lvl = currentWheelLevels()[idx];
  return {found:new Set(), revealed:{}, hintsLeft:WHEEL_HINTS, hintsUsed:0, pointsEarned:0, wheelOrder:shuffledIndices(lvl.letters.length), attempt:[], usedIdx:new Set()};
}
function renderWheel(){
  const levels = currentWheelLevels();
  if(state.wheel.levelIndex >= levels.length) state.wheel.levelIndex = 0;
  if(!wheelRun) wheelRun = newWheelRun(state.wheel.levelIndex);
  const lvl = levels[state.wheel.levelIndex];
  app.innerHTML = stationHeader(`عجلة الكلمات · ${state.tier}`) + tipBanner('wheel') + `
    <p class="subtitle">المستوى ${state.wheel.levelIndex+1}/${levels.length} — جذر هذه المجموعة، ابحث عن ${lvl.words.length} كلمات</p>
    <div class="board" id="board"></div>
    <div class="wheel-wrap" id="wheelWrap" style="position:relative; width:220px; height:220px; margin:14px auto 8px;">
      <div style="position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffffff30, transparent 60%), var(--lav-mid); box-shadow:inset 0 0 0 6px rgba(255,251,244,0.35), 0 10px 0 rgba(56,45,92,0.3);"></div>
      <button id="wheelCenter" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:46px; height:46px; border-radius:50%; border:none; background:var(--cream); color:var(--lav-deep); font-size:17px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.15);">⌫</button>
      <div id="wheelLetters"></div>
    </div>
    <div class="attempt-row" style="display:flex; flex-direction:column; align-items:center; gap:9px; margin:12px 0 6px; min-height:56px;">
      <div class="attempt-tiles" id="attemptTiles" style="display:flex; gap:6px; min-height:42px; align-items:center; flex-wrap:wrap; justify-content:center;"></div>
      <div class="scramble-actions">
        <button class="pill-btn" id="wheelHintBtn">💡 تلميح (${wheelRun.hintsLeft})</button>
        <button class="pill-btn primary" id="wheelCheckBtn">تحقق</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
  `;
  attachHeader();
  renderWheelBoard(); renderWheelLetters(); renderWheelAttempt();
  el('wheelCenter').addEventListener('click', wheelClear);
  el('wheelCheckBtn').addEventListener('click', wheelCheck);
  el('wheelHintBtn').addEventListener('click', wheelHint);
}
function renderWheelBoard(){
  const lvl = currentWheelLevels()[state.wheel.levelIndex];
  el('board').innerHTML = lvl.words.map((w,wi)=>{
    const found = wheelRun.found.has(wi);
    const shown = found ? w : (wheelRun.revealed[wi] || '');
    return `<div class="word-row ${found?'solved':''}" style="display:flex; justify-content:center; gap:5px;">${w.split('').map((ch,ci)=>{
      const letter = found ? ch : (shown[ci] || '');
      return `<div class="tile" style="width:27px; height:33px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; background:${found?'var(--sage)':'var(--cream-dim)'}; color:${found||letter?(found?'#fff':'var(--ink)'):'transparent'}; border:2px solid rgba(51,43,77,0.12);">${letter||'&nbsp;'}</div>`;
    }).join('')}</div>`;
  }).join('');
}
function renderWheelLetters(){
  const lvl = currentWheelLevels()[state.wheel.levelIndex];
  const wrap = el('wheelLetters');
  const n = lvl.letters.length, R = 82;
  wrap.innerHTML = wheelRun.wheelOrder.map((li,pos)=>{
    const angle = (pos/n)*2*Math.PI - Math.PI/2;
    const x = 110 + R*Math.cos(angle) - 23, y = 110 + R*Math.sin(angle) - 23;
    const used = wheelRun.usedIdx.has(li);
    return `<button data-idx="${li}" style="position:absolute; left:${x}px; top:${y}px; width:46px; height:46px; border-radius:50%; background:var(--wheat); border:3px solid var(--cream); color:var(--lav-deep); font-weight:800; font-size:19px; cursor:pointer; box-shadow:0 4px 0 rgba(166,120,20,0.4); opacity:${used?0:1}; pointer-events:${used?'none':'auto'};">${lvl.letters[li]}</button>`;
  }).join('');
  wrap.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=> wheelPick(parseInt(b.dataset.idx))));
}
function renderWheelAttempt(){
  el('attemptTiles').innerHTML = wheelRun.attempt.map((it,i)=>`<div class="attempt-tile" data-i="${i}" style="min-width:34px; height:40px; padding:0 4px; border-radius:9px; background:var(--lav-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; cursor:pointer; box-shadow:0 4px 0 rgba(56,45,92,0.45);">${it.letter}</div>`).join('');
  el('attemptTiles').querySelectorAll('.attempt-tile').forEach(t=> t.addEventListener('click', ()=>{
    const i = parseInt(t.dataset.i); const item = wheelRun.attempt[i];
    wheelRun.usedIdx.delete(item.wheelIdx); wheelRun.attempt.splice(i,1); renderWheelLetters(); renderWheelAttempt();
  }));
}
function wheelPick(idx){
  const lvl = currentWheelLevels()[state.wheel.levelIndex];
  wheelRun.attempt.push({letter:lvl.letters[idx], wheelIdx:idx}); wheelRun.usedIdx.add(idx);
  renderWheelLetters(); renderWheelAttempt();
}
function wheelClear(){ wheelRun.attempt.forEach(it=> wheelRun.usedIdx.delete(it.wheelIdx)); wheelRun.attempt=[]; renderWheelLetters(); renderWheelAttempt(); }
function wheelFlash(t){ el('msg').textContent=t; setTimeout(()=>{ if(el('msg') && el('msg').textContent===t) el('msg').textContent=''; },1300); }
function wheelCheck(){
  const lvl = currentWheelLevels()[state.wheel.levelIndex];
  const built = wheelRun.attempt.map(a=>a.letter).join('');
  if(!built){ wheelFlash('اختر أحرفا أولا'); return; }
  const wi = lvl.words.indexOf(built);
  if(wi!==-1 && !wheelRun.found.has(wi)){
    wheelRun.found.add(wi); addXP('wheel', 6+built.length); wheelRun.pointsEarned += 6+built.length;
    wheelFlash('أحسنت! ✔'); wheelClear(); renderWheelBoard();
    if(wheelRun.found.size===lvl.words.length){
      fireConfetti(); showToast('🔁 اكتمل المستوى — مستوى جديد!');
      setTimeout(()=>{ state.wheel.levelIndex=(state.wheel.levelIndex+1)%currentWheelLevels().length; wheelRun=null; renderWheel(); }, 900);
    }
  } else if(wi!==-1){ wheelFlash('وجدتَها من قبل'); wheelClear(); }
  else { wheelFlash('هذه الكلمة ليست في القائمة'); wheelClear(); document.getElementById('wheelWrap').classList.add('shake'); setTimeout(()=>document.getElementById('wheelWrap')&&document.getElementById('wheelWrap').classList.remove('shake'),350); }
}
function wheelHint(){
  const lvl = currentWheelLevels()[state.wheel.levelIndex];
  if(wheelRun.hintsLeft<=0){ wheelFlash('لا مزيد من التلميحات لهذا المستوى'); return; }
  const remaining = lvl.words.map((w,i)=>i).filter(i=>!wheelRun.found.has(i));
  if(!remaining.length) return;
  const wi = remaining[Math.floor(Math.random()*remaining.length)];
  const w = lvl.words[wi]; const shown = wheelRun.revealed[wi] || '';
  if(shown.length < w.length){ wheelRun.revealed[wi] = w.slice(0, shown.length+1); wheelRun.hintsLeft--; wheelRun.hintsUsed++; }
  renderWheelBoard(); el('wheelHintBtn').textContent = `💡 تلميح (${wheelRun.hintsLeft})`;
}

   ٤) أزواج المرادفات (ذاكرة، غير محدود)
========================================================= */
const SYN_PAIRS_BY_TIER = {
  'مبتدئ': [["سعيد","فرحان"],["كبير","ضخم"],["جميل","حسن"],["سريع","عجول"],["قديم","عتيق"],["صعب","عسير"]],
  'متوسط': [["غاضب","ساخط"],["ذكي","نبيه"],["شجاع","جريء"],["أجّل","أخّر"],["أعلن","صرّح"],["نجاح","توفيق"]],
  'متقدم': [["متقن","دقيق"],["غامض","ملتبس"],["صامد","ثابت"],["محتوم","حتمي"],["مماطلة","تسويف"],["حذر","متيقظ"]],
};
function renderMatch(){
  if(!state.match.cards.length){
    const pairs = shuffle(SYN_PAIRS_BY_TIER[state.tier]).slice(0,6);
    state.match.roundPairs = pairs;
    const cards = pairs.flatMap((p,pi)=>[{pi,text:p[0]},{pi,text:p[1]}]);
    state.match.cards = shuffle(cards).map((c,id)=>({...c,id}));
    state.match.flipped=[]; state.match.matched=new Set(); state.match.moves=0;
  }
  const pairs = state.match.roundPairs;
  app.innerHTML = stationHeader(`أزواج المرادفات · ${state.tier}`) + tipBanner('match') + `
    <div class="match-stats"><span>المحاولات: ${state.match.moves}</span><span>الأزواج: ${state.match.matched.size/2}/${pairs.length}</span></div>
    <div class="match-grid" id="matchGrid"></div>
  `;
  attachHeader(); renderMatchGrid();
}
function renderMatchGrid(){
  const m = state.match;
  el('matchGrid').innerHTML = m.cards.map(c=>{
    const shown = m.flipped.includes(c.id) || m.matched.has(c.id);
    return `<div class="match-card ${shown?(m.matched.has(c.id)?'matched':'flipped'):''}" data-id="${c.id}"><div class="face">${c.text}</div></div>`;
  }).join('');
  el('matchGrid').querySelectorAll('.match-card').forEach(card=> card.addEventListener('click', ()=> matchFlip(parseInt(card.dataset.id))));
}
function matchFlip(id){
  const m = state.match;
  if(m.matched.has(id) || m.flipped.includes(id) || m.flipped.length>=2) return;
  m.flipped.push(id); renderMatchGrid();
  if(m.flipped.length===2){
    m.moves++;
    const [a,b] = m.flipped.map(fid=> m.cards.find(c=>c.id===fid));
    if(a.pi===b.pi){
      setTimeout(()=>{ m.matched.add(a.id); m.matched.add(b.id); m.flipped=[]; addXP('match',8); renderMatch();
        if(m.matched.size===m.cards.length){ fireConfetti(); const stars = m.moves<=m.cards.length/2+2 ? 3 : (m.moves<=m.cards.length ? 2 : 1); showToast(`🎉 اكتمل في ${m.moves} محاولة — ${'⭐'.repeat(stars)}`); setTimeout(()=>{ state.match.cards=[]; renderMatch(); },1100); }
      }, 500);
    } else { setTimeout(()=>{ m.flipped=[]; renderMatchGrid(); },700); }
  }
}

function renderRecall(){
  const r=state.recall;
  if(!r.queue.length) r.queue = shuffle(RECALL_WORDS[state.tier].map((w,i)=>i));
  const idx=r.queue[0], [word,def]=RECALL_WORDS[state.tier][idx];
  app.innerHTML = stationHeader(`البطاقات السريعة · ${state.tier}`) + tipBanner('recall') + `

    <div class="recall-stats">أُتقنت في هذه الجلسة: ${r.mastered}</div>
  `;
  attachHeader();
  el('flipBtn').addEventListener('click', ()=>{ el('defText').classList.add('show'); el('flipRow').style.display='none'; el('rateRow').style.display='flex'; });
  el('stillBtn').addEventListener('click', ()=> recallRate(false));
  el('gotItBtn').addEventListener('click', ()=> recallRate(true));
}
function recallRate(knewIt){
  const r=state.recall; const idx=r.queue.shift();
  if(knewIt){ r.mastered++; addXP('recall',5); r.queue.push(idx); }
  else { const insertAt=Math.min(2,r.queue.length); r.queue.splice(insertAt,0,idx); }
  if(r.mastered>0 && r.mastered%5===0) showToast(`🧠 ${r.mastered} كلمات أُتقنت في هذه الجلسة!`);
  renderRecall();
}

  app.innerHTML = stationHeader(`رحلة القراءة · ${state.tier}`) + tipBanner('reading') + `

  `;
  attachHeader(); renderReadingQuestions();
  el('checkReadingBtn').addEventListener('click', checkReading);
  el('nextPassageBtn').addEventListener('click', ()=>{ r.pIndex=(r.pIndex+1)%passages.length; r.answers=[null,null,null]; r.checked=false; renderReading(); });
}
function renderReadingQuestions(){
  const passages=READING_BY_TIER[state.tier], r=state.reading, passage=passages[r.pIndex];
  const area = el('questionsArea');
  area.innerHTML = passage.qs.map((qq,qi)=>`<div class="rq-question">${qi+1}. ${qq.q}</div><div class="options">${qq.options.map((opt,oi)=>`<button class="option-btn" data-qi="${qi}" data-oi="${oi}">${opt}</button>`).join('')}</div>`).join('');
  area.querySelectorAll('.option-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    if(r.checked) return;
    const qi=parseInt(btn.dataset.qi), oi=parseInt(btn.dataset.oi);
    r.answers[qi]=oi;
    area.querySelectorAll(`.option-btn[data-qi="${qi}"]`).forEach(b=> b.style.outline='none');
    area.querySelectorAll(`.option-btn[data-qi="${qi}"][data-oi="${oi}"]`).forEach(b=> b.style.outline='2px solid var(--lav-deep)');
  }));
}
function checkReading(){
  const passages=READING_BY_TIER[state.tier], r=state.reading, passage=passages[r.pIndex];

  r.checked=true; let correctCount=0; const area=el('questionsArea');
  passage.qs.forEach((qq,qi)=>{
    const chosen=r.answers[qi]; if(chosen===qq.correct) correctCount++;
    area.querySelectorAll(`.option-btn[data-qi="${qi}"]`).forEach(b=>{ b.disabled=true; const oi=parseInt(b.dataset.oi); if(oi===qq.correct) b.classList.add('correct'); else if(oi===chosen) b.classList.add('wrong'); });
  });
  addXP('reading', correctCount*10); showToast(`📖 ${correctCount}/3 إجابات صحيحة`);
}

/* =========================================================
   ٨) عائلات الكلمات (تصنيف، غير محدود)
========================================================= */
const GROUPS_BY_TIER = {
  'مبتدئ': [
    {name:'العائلة', words:['أم','أب','أخت','أخ','عمة','عم']},
    {name:'الحيوانات', words:['كلب','قطة','طائر','سمكة','أرنب','حصان']},
    {name:'الطعام', words:['خبز','أرز','بيض','جبن','تفاح','دجاج']},
    {name:'الألوان', words:['أحمر','أزرق','أخضر','أصفر','أسود','أبيض']},
    {name:'الجسم', words:['رأس','يد','عين','قدم','أذن','أنف']},
    {name:'الملابس', words:['قميص','حذاء','قبعة','فستان','جوارب','سترة']},
    {name:'المنزل', words:['غرفة نوم','مطبخ','صالة','حديقة','باب','نافذة']},
    {name:'المدرسة', words:['دفتر','قلم','معلم','تلميذ','سبورة','صف']},
    {name:'الفصول', words:['الربيع','الصيف','الخريف','الشتاء','شمس','ثلج']},
  ],
  'متوسط': [
    {name:'الطقس', words:['مطر','ثلج','مشمس','غائم','عاصف','رعد']},
    {name:'المشاعر', words:['سعيد','غاضب','متوتر','متحمس','ملل','مندهش']},
    {name:'المهن', words:['معلم','طبيب','مهندس','طباخ','ممرض','محامٍ']},
    {name:'الأثاث', words:['طاولة','كرسي','أريكة','خزانة','رف','مرآة']},
    {name:'المواصلات', words:['حافلة','قطار','دراجة','طائرة','مترو','عبّارة']},
    {name:'المدرسة', words:['واجب','امتحان','جدول','حصة','دفتر','فصل دراسي']},
    {name:'السفر', words:['جواز سفر','حقيبة','مطار','فندق','تذكرة','جمارك']},
    {name:'التقنية', words:['حاسوب','تطبيق','إنترنت','شاشة','لوحة مفاتيح','شبكة']},
    {name:'الصحة', words:['طبيب','صيدلية','تمرين','نوم','فيتامين','استشارة']},
  ],
  'متقدم': [
    {name:'مشاعر دقيقة', words:['كئيب','نشوان','متوجس','لامبالٍ','حاقد','مسرور']},
    {name:'أفعال أكاديمية', words:['يحلل','يبرر','يلخص','يقيّم','يقارن','يستنتج']},
    {name:'مفردات الأعمال', words:['دخل','تفاوض','صاحب مصلحة','موعد نهائي','اندماج','ميزانية']},
    {name:'تعبيرات اصطلاحية', words:['كسر الجليد','ضرب عصفورين بحجر','بسيط جدا','غرق في الكتب','نادرا جدا','مكلف جدا']},
    {name:'أدوات ربط رسمية', words:['ومع ذلك','بالتالي','علاوة على ذلك','رغم ذلك','من الآن فصاعدا','مع أن']},
    {name:'تقنيات الطبخ', words:['يخفق','يطهو على نار هادئة','يتبّل','يقلي','يزيّن','يعجن']},
    {name:'السياسة', words:['حكومة','ناخب','إصلاح','برلمان','وزير','اقتراع']},
    {name:'البيئة', words:['مستدام','إعادة تدوير','البصمة الكربونية','تنوع بيولوجي','متجدد','تلوث']},
    {name:'الفلسفة', words:['أخلاق','ميتافيزيقا','عقلانية','ذاتية','جدلية','وجودية']},
  ],
};
function newGroupsRound(){
  const cats = shuffle(GROUPS_BY_TIER[state.tier]).slice(0,3);
  const pool = shuffle(cats.flatMap(c=> c.words.map(w=>({word:w, cat:c.name}))));
  state.groups = {tier:state.tier, cats:cats.map(c=>({name:c.name, placed:0, total:c.words.length})), pool, selectedId:null, moves:0};
}
function renderGroups(){
  if(state.groups.tier!==state.tier || !state.groups.cats.length) newGroupsRound();
  app.innerHTML = stationHeader(`عائلات الكلمات · ${state.tier}`) + tipBanner('groups') + `
    <div class="groups-wrap">
      <div class="word-pool" id="wordPool"></div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="msg" id="msg"></div>
  `;
  attachHeader(); renderGroupsUI();
}
function renderGroupsUI(){
  const g = state.groups;
  el('wordPool').innerHTML = g.pool.map((w,i)=>`<div class="word-chip ${g.selectedId===i?'selected':''}" data-i="${i}">${w.word}</div>`).join('') || `<span style="font-size:12.5px; color:var(--ink-soft);">تم تصنيف كل الكلمات!</span>`;
  el('catGrid').innerHTML = g.cats.map((c,ci)=>`<div class="cat-card" data-ci="${ci}">${c.name}<span class="placed">${c.placed}/${c.total} صُنّفت</span></div>`).join('');
  el('wordPool').querySelectorAll('.word-chip').forEach(chip=> chip.addEventListener('click', ()=>{ g.selectedId = g.selectedId===parseInt(chip.dataset.i) ? null : parseInt(chip.dataset.i); renderGroupsUI(); }));
  el('catGrid').querySelectorAll('.cat-card').forEach(card=> card.addEventListener('click', ()=> groupsPlace(parseInt(card.dataset.ci))));
}
function groupsPlace(ci){
  const g = state.groups;
  if(g.selectedId===null){ el('msg').textContent='المس كلمة أولا'; setTimeout(()=>{ if(el('msg')) el('msg').textContent=''; },1200); return; }
  const word = g.pool[g.selectedId], cat = g.cats[ci];
  g.moves++;
  if(word.cat===cat.name){
    cat.placed++; g.pool.splice(g.selectedId,1); g.selectedId=null; addXP('groups',8);
    if(g.pool.length===0){ fireConfetti(); showToast('🔁 صُنّفت كل الفئات — مجموعة جديدة!'); setTimeout(()=>{ newGroupsRound(); renderGroups(); },900); return; }
    renderGroupsUI();
  } else { el('msg').textContent='ليست هذه الفئة — حاول مجددا'; g.selectedId=null; renderGroupsUI(); setTimeout(()=>{ if(el('msg')) el('msg').textContent=''; },1200); }
}

/* =========================================================
   ٩) مزيج اليوم (تدريب متداخل، غير محدود)
   تربويا: تداخل المهارات، أثر الاختبار، التكرار المتباعد —
   مزيج مختلف كل يوم تقويمي محدد بخوارزمية ثابتة.
========================================================= */
const DAILY_STEP_LABELS = ['القواعد','ترتيب الجملة','الفئات','الذاكرة'];
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return h; }
function seededPick(arr, seed, salt){ const idx=(seed+salt*2654435761)>>>0; return arr[idx%arr.length]; }
function setupDailyMix(){
  const today = todayStr(), dm = state.daily;
  if(dm.date===today && dm.tier===state.tier && dm.items) return;
  const seed = hashStr(today+state.tier);
  const gItem = seededPick(grammarPool(), seed, 1);
  const sItem = seededPick(scramblePool(), seed, 2);
  const catsForTier = GROUPS_BY_TIER[state.tier];
  const catIdx = seededPick([...Array(catsForTier.length).keys()], seed, 3);
  const cat = catsForTier[catIdx];
  const wordEntry = seededPick(cat.words, seed, 4);
  const otherCats = catsForTier.filter((_,i)=>i!==catIdx);
  const distractor1 = seededPick(otherCats, seed, 5).name, distractor2 = seededPick(otherCats, seed, 6).name;
  const catOptions = shuffle([cat.name, distractor1, distractor2].filter((v,i,a)=>a.indexOf(v)===i));
  const rItem = seededPick(RECALL_WORDS[state.tier], seed, 7);
  state.daily = {date:today, tier:state.tier, stepIndex:0,
    items:{grammar:gItem, scramble:sItem, catWord:wordEntry, catCorrect:cat.name, catOptions, recall:rItem},
    streak:dm.streak||0, xpEarnedToday:0, gAnswered:false,
    scAnswer:[], scPool:sItem.words.map((w,i)=>({word:w,id:i})).sort(()=>Math.random()-0.5),
    catSelected:null, catAnswered:false, done:false};
}
function renderDaily(){
  setupDailyMix(); const dm=state.daily;
  app.innerHTML = stationHeader(`مزيج اليوم · ${state.tier}`) + tipBanner('daily') + `
    <div class="streak-row"><span class="streak-pill">🔥 سلسلة ${dm.streak} يوما</span></div>
    <div class="daily-progress" id="dailyProgress"></div>
    <div class="daily-label" id="dailyLabel"></div>
    <div id="dailyBody"></div>
  `;
  attachHeader(); renderDailyProgress(); renderDailyStep();
}
function renderDailyProgress(){
  const dm=state.daily;
  el('dailyProgress').innerHTML = DAILY_STEP_LABELS.map((_,i)=>`<div class="seg ${dm.done?'done':(i<dm.stepIndex?'done':(i===dm.stepIndex?'current':''))}"></div>`).join('');
  el('dailyLabel').textContent = dm.done ? 'اكتمل مزيج اليوم!' : `الخطوة ${dm.stepIndex+1} من 4 — ${DAILY_STEP_LABELS[dm.stepIndex]}`;
}
function renderDailyStep(){
  const dm=state.daily, body=el('dailyBody');
  if(dm.done){
    body.innerHTML = `<div class="daily-done"><div class="big-emoji">🎉</div><p class="qtext" style="margin-bottom:6px;">أحسنت — اكتمل مزيج اليوم!</p><p class="subtitle">+${dm.xpEarnedToday} نقطة اليوم. عد غدا لمزيج جديد.</p><div class="scramble-actions" style="margin-top:16px;"><button class="pill-btn primary" id="dailyBackBtn">العودة إلى الحديقة</button></div></div>`;
    el('dailyBackBtn').addEventListener('click', goHub); return;
  }
  if(dm.stepIndex===0) renderDailyGrammar();
  else if(dm.stepIndex===1) renderDailyScramble();
  else if(dm.stepIndex===2) renderDailyCategory();
  else renderDailyRecall();
}
function dailyAdvance(){
  const dm=state.daily; dm.stepIndex++;
  if(dm.stepIndex>=4){ dm.done=true; dm.streak+=1; showToast('🔥 امتدت السلسلة — إلى الغد!'); renderDaily(); return; }
  renderDailyProgress(); renderDailyStep();
}
function renderDailyGrammar(){
  const dm=state.daily, item=dm.items.grammar;
  el('dailyBody').innerHTML = `<div class="quiz-card"><p class="qtext">${item.q}</p><div class="options">${item.options.map((o,i)=>`<button class="option-btn" data-i="${i}">${o}</button>`).join('')}</div><div class="explain" id="dExplain">${item.explain}</div></div><div class="quiz-footer"><button class="pill-btn primary" id="dNextBtn" disabled>التالي</button></div>`;
  document.querySelectorAll('#dailyBody .option-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    if(dm.gAnswered) return; dm.gAnswered=true; const i=parseInt(btn.dataset.i);
    document.querySelectorAll('#dailyBody .option-btn').forEach((b,idx)=>{ b.disabled=true; if(idx===item.correct) b.classList.add('correct'); else if(idx===i) b.classList.add('wrong'); });
    if(i===item.correct){ addXP('daily',10); dm.xpEarnedToday+=10; }
    el('dExplain').classList.add('show'); el('dNextBtn').disabled=false;
  }));
  el('dNextBtn').addEventListener('click', dailyAdvance);
}
function renderDailyScramble(){
  const dm=state.daily, item=dm.items.scramble;
  el('dailyBody').innerHTML = `<p class="subtitle">المس الكلمات بالترتيب الصحيح.</p><div class="scramble-target empty" id="dTarget"></div><div class="pool-wrap" id="dPool"></div><div class="msg" id="dMsg"></div><div class="scramble-actions"><button class="pill-btn" id="dUndoBtn">تراجع</button><button class="pill-btn primary" id="dCheckBtn">تحقق</button></div>`;
  renderDailyScrambleUI();
  el('dUndoBtn').addEventListener('click', ()=>{ if(dm.scAnswer.length){ dm.scPool.push(dm.scAnswer.pop()); renderDailyScrambleUI(); } });
  el('dCheckBtn').addEventListener('click', ()=>{
    const built = dm.scAnswer.map(a=>a.word).join(' ');
    if(dm.scAnswer.length<item.words.length){ el('dMsg').textContent='استخدم كل الكلمات أولا'; return; }
    if(built===item.sentence){ addXP('daily',15); dm.xpEarnedToday+=15; el('dMsg').textContent='صحيح! ✔'; setTimeout(dailyAdvance,700); }
    else { el('dMsg').textContent='ليس تماما — تحقق من الترتيب'; }
  });
}
function renderDailyScrambleUI(){
  const dm=state.daily, target=el('dTarget'), pool=el('dPool');
  target.classList.toggle('empty', dm.scAnswer.length===0);
  target.innerHTML = dm.scAnswer.map((item,i)=>`<div class="chip answer" data-i="${i}">${item.word}</div>`).join('');
  pool.innerHTML = dm.scPool.map(item=>`<div class="chip pool" data-id="${item.id}">${item.word}</div>`).join('');
  target.querySelectorAll('.chip.answer').forEach(chip=> chip.addEventListener('click', ()=>{ const i=parseInt(chip.dataset.i); dm.scPool.push(dm.scAnswer[i]); dm.scAnswer.splice(i,1); renderDailyScrambleUI(); }));
  pool.querySelectorAll('.chip.pool').forEach(chip=> chip.addEventListener('click', ()=>{ const id=parseInt(chip.dataset.id); const pi=dm.scPool.findIndex(p=>p.id===id); dm.scAnswer.push(dm.scPool[pi]); dm.scPool.splice(pi,1); renderDailyScrambleUI(); }));
}
function renderDailyCategory(){
  const dm=state.daily;
  el('dailyBody').innerHTML = `<div class="quiz-card"><p class="qtext">أي فئة تناسب «${dm.items.catWord}»؟</p><div class="options">${dm.items.catOptions.map((opt,i)=>`<button class="option-btn" data-opt="${opt}">${opt}</button>`).join('')}</div></div><div class="quiz-footer"><button class="pill-btn primary" id="dNextBtn" disabled>التالي</button></div>`;
  document.querySelectorAll('#dailyBody .option-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    if(dm.catAnswered) return; dm.catAnswered=true; const chosen=btn.dataset.opt;
    document.querySelectorAll('#dailyBody .option-btn').forEach(b=>{ b.disabled=true; if(b.dataset.opt===dm.items.catCorrect) b.classList.add('correct'); else if(b.dataset.opt===chosen) b.classList.add('wrong'); });
    if(chosen===dm.items.catCorrect){ addXP('daily',10); dm.xpEarnedToday+=10; }
    el('dNextBtn').disabled=false;
  }));
  el('dNextBtn').addEventListener('click', dailyAdvance);
}
function renderDailyRecall(){
  const dm=state.daily, [word,def]=dm.items.recall;
  el('dailyBody').innerHTML = `<div class="flashcard"><div class="icon-emoji">🍃</div><div class="word">${word}</div><div class="def" id="dDef">${def}</div></div><div class="scramble-actions" id="dFlipRow"><button class="pill-btn primary" id="dFlipBtn">اعرض المعنى</button></div>`;
  el('dFlipBtn').addEventListener('click', ()=>{
    el('dDef').classList.add('show');
    el('dFlipRow').innerHTML = `<button class="pill-btn primary" id="dFinishBtn">أعرفها — أنهِ المزيج</button>`;
    el('dFinishBtn').addEventListener('click', ()=>{ addXP('daily',5); dm.xpEarnedToday+=5; dailyAdvance(); });
  });
}

/* =========================================================
   الموجّه (الراوتر)
========================================================= */
function render(){
  if(state.screen==='hub') renderHub();
  else if(state.screen==='wheel'){ wheelRun=null; renderWheel(); }
  else if(state.screen==='grammar') renderGrammar();
  else if(state.screen==='scramble') renderScramble();
  else if(state.screen==='match'){ state.match.cards=[]; renderMatch(); }
  else if(state.screen==='describe'){ state.describe.scene=null; renderDescribe(); }
  else if(state.screen==='recall'){ state.recall.queue=[]; renderRecall(); }
  else if(state.screen==='reading'){ state.reading={pIndex:0, answers:[null,null,null], checked:false}; renderReading(); }
  else if(state.screen==='groups'){ state.groups.cats=[]; renderGroups(); }
  else if(state.screen==='daily'){ renderDaily(); }
  else if(state.screen==='guide'){ state.showGuide=true; state.screen='hub'; renderGuide(); }
}

document.addEventListener('keydown',(e)=>{
  if(state.screen==='wheel' && wheelRun){
    if(e.key==='Enter'){ wheelCheck(); return; }
    if(e.key==='Backspace'){ const st=wheelRun; if(st.attempt.length){ const item=st.attempt.pop(); st.usedIdx.delete(item.wheelIdx); renderWheelLetters(); renderWheelAttempt(); } return; }
    if(e.key==='Escape'){ wheelClear(); return; }
    const letter=e.key;
    if(letter.length===1){
      const lvl = currentWheelLevels()[state.wheel.levelIndex];
      const idx = lvl.letters.split('').findIndex((ch,i)=> ch===letter && !wheelRun.usedIdx.has(i));
      if(idx!==-1) wheelPick(idx);
    }
  }
});

render();
</script>
